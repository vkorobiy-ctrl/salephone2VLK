<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef0f3;
    --card:#ffffff;
    --ink:#14161a;
    --graphite:#5b6068;
    --line:#dcdfe4;
    --signal:#1b4dff;
    --star:#f5a300;
    --ok:#0f9d58;
    --radius:18px;
    --shell:1120px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}

  /* header */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(238,240,243,.86);backdrop-filter:saturate(160%) blur(12px);
    border-bottom:1px solid var(--line);
  }
  .bar{max-width:var(--shell);margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .wordmark{font-weight:600;letter-spacing:-.02em;font-size:1.0625rem}
  .wordmark span{color:var(--graphite);font-weight:400}
  .cart-btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:#fff;border:0;padding:9px 16px;border-radius:999px;font-weight:500;font-size:.9375rem}
  .cart-btn:hover{background:#2a2e36}
  .count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums}

  /* hero */
  .hero{max-width:var(--shell);margin:0 auto;padding:64px 20px 34px}
  .hero h1{margin:0;font-size:clamp(2.6rem,7.5vw,5rem);line-height:.95;letter-spacing:-.045em;font-weight:600}
  .hero p{margin:16px 0 0;max-width:38ch;color:var(--graphite);font-size:1.0625rem}

  /* filters */
  .filters{max-width:var(--shell);margin:0 auto;padding:0 20px 24px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:transparent;border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-size:.9375rem;color:var(--graphite)}
  .chip:hover{border-color:#b9bec6;color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* grid */
  .grid{max-width:var(--shell);margin:0 auto;padding:0 20px 96px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
  .product{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
  .product.hidden{display:none}
  .stage{aspect-ratio:4/5;border-radius:12px;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#e9ecf0 100%);padding:16px;position:relative}
  .stage img{width:100%;height:100%;object-fit:contain;display:block}
  .new{position:absolute;top:12px;left:12px;background:var(--signal);color:#fff;font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(20,22,26,.18);box-shadow:inset 0 0 0 2px #fff}
  .swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--ink)}
  .pname{margin:0;font-size:1.125rem;font-weight:600;letter-spacing:-.02em}
  .ptag{margin:4px 0 0;color:var(--graphite);font-size:.9375rem}
  .rating{display:inline-flex;align-items:center;gap:7px;font-size:.9375rem;font-variant-numeric:tabular-nums}
  .stars{color:var(--star);letter-spacing:1px}
  .rating b{font-weight:600}
  .rating span{color:var(--graphite)}
  .buy{margin-top:auto;width:100%;background:var(--signal);color:#fff;border:0;padding:12px 16px;border-radius:12px;font-weight:500}
  .buy:hover{background:#1740d6}

  /* overlays */
  .scrim{position:fixed;inset:0;z-index:50;background:rgba(20,22,26,.42);display:none;align-items:center;justify-content:center;padding:20px}
  .scrim.open{display:flex}
  .sheet{width:100%;max-width:430px;background:var(--card);border-radius:20px;border:1px solid var(--line);padding:24px;box-shadow:0 24px 60px rgba(20,22,26,.28)}
  .sheet h2{margin:0;font-size:1.25rem;letter-spacing:-.02em}
  .sheet .sub{margin:6px 0 18px;color:var(--graphite);font-size:.9375rem}
  .preview{margin:0 auto 16px;width:130px;aspect-ratio:4/5}
  .preview img{width:100%;height:100%;object-fit:contain;display:block}
  .storages{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  .storage{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-align:center;font-weight:500}
  .storage[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .primary{width:100%;background:var(--ink);color:#fff;border:0;padding:14px;border-radius:12px;font-weight:500}
  .primary:hover{background:#2a2e36}
  .primary[disabled]{opacity:.4;cursor:not-allowed}
  .ghost{width:100%;background:transparent;border:1px solid var(--line);padding:12px;border-radius:12px;margin-top:8px;color:var(--graphite)}
  label{display:block;font-size:.9375rem;margin-bottom:8px}
  input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;margin-bottom:18px}
  input[type=text]:focus{outline:2px solid var(--signal);outline-offset:0;border-color:var(--signal)}

  /* cart */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;z-index:60;background:var(--card);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line)}
  .drawer-head h2{margin:0;font-size:1.125rem;letter-spacing:-.02em}
  .x{background:transparent;border:0;font-size:1.5rem;line-height:1;color:var(--graphite);padding:4px 8px}
  .items{flex:1;overflow:auto;padding:6px 20px}
  .empty{color:var(--graphite);text-align:center;padding:56px 12px;font-size:.9375rem}
  .item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .item img{width:48px;aspect-ratio:4/5;object-fit:contain;flex:none}
  .item .info{flex:1;min-width:0}
  .item .info strong{display:block;font-weight:600;font-size:.9375rem}
  .item .info span{color:var(--graphite);font-size:.875rem}
  .remove{background:transparent;border:0;color:var(--graphite);font-size:.8125rem;padding:2px 0;text-decoration:underline}
  .drawer-foot{padding:20px;border-top:1px solid var(--line)}
  .foot-note{margin:0 0 12px;color:var(--graphite);font-size:.875rem}

  /* delivery animation */
  .delivery{position:relative;height:170px;margin:4px 0 18px;overflow:hidden}
  .road{position:absolute;left:0;right:0;bottom:34px;height:3px;background:var(--line);border-radius:2px}
  .road::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#b9bec6 0 18px,transparent 18px 40px);
    animation:road .5s linear infinite;
  }
  @keyframes road{to{background-position:-40px 0}}
  .van{position:absolute;bottom:24px;left:50%;width:150px;margin-left:-75px;animation:drive 2.6s cubic-bezier(.3,.85,.3,1) forwards}
  .van img{width:100%;display:block}
  @keyframes drive{
    0%{transform:translateX(-260px)}
    38%{transform:translateX(0)}
    62%{transform:translateX(0)}
    100%{transform:translateX(320px)}
  }
  .parcel{
    position:absolute;bottom:30px;left:50%;margin-left:22px;
    width:34px;height:30px;border-radius:4px;background:#f97316;
    box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);
    opacity:0;animation:drop 2.6s linear forwards;
  }
  .parcel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:rgba(255,255,255,.55)}
  @keyframes drop{
    0%,45%{opacity:0;transform:translateY(-26px)}
    55%{opacity:1;transform:translateY(0)}
    100%{opacity:1;transform:translateY(0)}
  }
  .status{text-align:center}
  .status h2{margin:0 0 6px}
  .status p{margin:0;color:var(--graphite);font-size:.9375rem}
  .tick{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.375rem}
  @media (prefers-reduced-motion:reduce){
    .van,.parcel,.road::after{animation:none}
    .van{transform:none}
    .parcel{opacity:1}
  }
  @media (max-width:520px){
    .hero{padding-top:44px}
    .storages{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="wordmark">iPhone <span>Store</span></div>
    <button class="cart-btn" id="openCart">🛒 Cart <span class="count" id="count">0</span></button>
  </div>
</header>

<section class="hero">
  <h1>Latest iPhones</h1>
  <p>Experience the future of smartphones</p>
</section>

<div class="filters" id="filters">
  <button class="chip" data-series="all" aria-pressed="true">All Models</button>
  <button class="chip" data-series="18" aria-pressed="false">iPhone 18</button>
  <button class="chip" data-series="17" aria-pressed="false">iPhone 17</button>
  <button class="chip" data-series="16" aria-pressed="false">iPhone 16</button>
</div>

<main class="grid" id="grid"></main>

<!-- storage picker -->
<div class="scrim" id="storageScrim" role="dialog" aria-modal="true" aria-labelledby="storageTitle">
  <div class="sheet">
    <h2 id="storageTitle">Choose storage</h2>
    <p class="sub" id="storageSub"></p>
    <div class="preview"><img id="storageImg" alt=""></div>
    <div class="storages" id="storages"></div>
    <button class="primary" id="storageContinue">Continue</button>
    <button class="ghost" data-close>Back to models</button>
  </div>
</div>

<!-- address -->
<div class="scrim" id="addressScrim" role="dialog" aria-modal="true" aria-labelledby="addressTitle">
  <div class="sheet">
    <h2 id="addressTitle">Where should we deliver?</h2>
    <p class="sub" id="addressSub"></p>
    <label for="address">Address:</label>
    <input type="text" id="address" placeholder="Street, building, apartment, city" autocomplete="street-address">
    <button class="primary" id="addressContinue">Continue</button>
    <button class="ghost" data-close>Back to cart</button>
  </div>
</div>

<!-- delivery status -->
<div class="scrim" id="statusScrim" role="dialog" aria-modal="true" aria-live="polite">
  <div class="sheet">
    <div id="statusPending">
      <div class="delivery" id="deliveryStage">
        <div class="road"></div>
        <div class="parcel"></div>
        <div class="van"><img src="images/courier.webp" alt="Delivery van on its way"></div>
      </div>
      <div class="status">
        <h2>Preparing your delivery...</h2>
        <p>Please wait</p>
      </div>
    </div>
    <div class="status" id="statusDone" hidden>
      <div class="tick">✓</div>
      <h2>Your order has been accepted!</h2>
      <p>We'll deliver it soon</p>
      <button class="primary" style="margin-top:20px" id="doneBtn">Back to store</button>
    </div>
  </div>
</div>

<!-- cart -->
<aside class="drawer" id="drawer" aria-label="Your Cart">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button class="x" id="closeCart" aria-label="Close cart">×</button>
  </div>
  <div class="items" id="items"></div>
  <div class="drawer-foot">
    <p class="foot-note">Free delivery on every order.</p>
    <button class="primary" id="checkout" disabled>Checkout</button>
  </div>
</aside>

<script>
const RATING = '4.8';

const MODELS = [
  { id:'18promax', name:'iPhone 18 Pro Max', series:'18', isNew:true,
    tagline:'6.9-inch display, 5x tetraprism zoom',
    storage:['256GB','512GB','1TB','2TB'],
    colors:[
      { name:'Deep Purple', hex:'#6b3b7a', img:'images/18-pro-max-purple.webp' },
      { name:'Crimson',     hex:'#a01f2c', img:'images/18-pro-max-red.webp' },
      { name:'Black',       hex:'#1c1c1e', img:'images/18-pro-max-black.webp' },
      { name:'Sky Blue',    hex:'#6fa8dc', img:'images/18-pro-max-blue.webp' }
    ] },

  { id:'18pro', name:'iPhone 18 Pro', series:'18', isNew:true,
    tagline:'6.3-inch display, 5x tetraprism zoom',
    storage:['256GB','512GB','1TB','2TB'],
    colors:[
      { name:'Deep Purple', hex:'#6b3b7a', img:'images/18-pro-max-purple.webp' },
      { name:'Crimson',     hex:'#a01f2c', img:'images/18-pro-max-red.webp' },
      { name:'Black',       hex:'#1c1c1e', img:'images/18-pro-max-black.webp' },
      { name:'Sky Blue',    hex:'#6fa8dc', img:'images/18-pro-max-blue.webp' }
    ] },

  { id:'18fold', name:'iPhone 18 Fold', series:'18', isNew:true,
    tagline:'Folding 7.8-inch display, dual camera',
    storage:['512GB','1TB','2TB'],
    colors:[
      { name:'Space Black', hex:'#2f3338', img:'images/18-fold-black.webp' }
    ] },

  { id:'17promax', name:'iPhone 17 Pro Max', series:'17', isNew:false,
    tagline:'6.9-inch display, titanium frame',
    storage:['256GB','512GB','1TB','2TB'],
    colors:[
      { name:'Cosmic Orange', hex:'#e8791f', img:'images/17-pro-max-orange.webp' },
      { name:'Midnight Blue', hex:'#28304a', img:'images/17-pro-max-blue.webp' },
      { name:'Silver',        hex:'#e6e7e9', img:'images/17-pro-max-white.webp' }
    ] },

  { id:'17', name:'iPhone 17', series:'17', isNew:false,
    tagline:'6.3-inch display, dual camera',
    storage:['128GB','256GB','512GB'],
    colors:[
      { name:'Pink', hex:'#e879a8', img:'images/17-pink.webp' },
      { name:'Teal', hex:'#78c2bd', img:'images/17-teal.webp' }
    ] },

  { id:'16promax', name:'iPhone 16 Pro Max', series:'16', isNew:false,
    tagline:'6.7-inch display, A18 Pro chip',
    storage:['256GB','512GB','1TB'],
    colors:[
      { name:'Black Titanium', hex:'#3a3a3c', img:'images/16-pro-max-black.webp' }
    ] }
];

const $ = s => document.querySelector(s);
let cart = [];
let picked = null;   // { model, colorIndex, storageIndex }

/* ---------- catalogue ---------- */
$('#grid').innerHTML = MODELS.map(m => `
  <article class="product" data-series="${m.series}" data-model="${m.id}">
    <div class="stage">
      ${m.isNew ? '<span class="new">New</span>' : ''}
      <img src="${m.colors[0].img}" alt="${m.name} in ${m.colors[0].name}" data-main>
    </div>
    ${m.colors.length > 1 ? `<div class="swatches">${m.colors.map((c, i) => `
      <button class="swatch" style="background:${c.hex}" data-color="${i}"
              aria-pressed="${i === 0}" aria-label="${c.name}" title="${c.name}"></button>`).join('')}</div>` : ''}
    <div>
      <h2 class="pname">${m.name}</h2>
      <p class="ptag">${m.tagline}</p>
    </div>
    <div class="rating">
      <span class="stars" aria-hidden="true">★★★★★</span>
      <b>${RATING}</b><span>out of 5</span>
    </div>
    <button class="buy">Choose storage</button>
  </article>`).join('');

/* colour swatches + open picker */
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.product');
  if (!card) return;
  const model = MODELS.find(m => m.id === card.dataset.model);

  const sw = e.target.closest('.swatch');
  if (sw){
    const c = model.colors[+sw.dataset.color];
    const img = card.querySelector('[data-main]');
    img.src = c.img;
    img.alt = model.name + ' in ' + c.name;
    card.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', String(x === sw)));
    return;
  }

  if (e.target.closest('.buy')){
    const active = card.querySelector('.swatch[aria-pressed="true"]');
    openStorage(model, active ? +active.dataset.color : 0);
  }
});

/* filters */
$('#filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
  const s = chip.dataset.series;
  document.querySelectorAll('.product').forEach(p => {
    p.classList.toggle('hidden', s !== 'all' && p.dataset.series !== s);
  });
});

/* ---------- storage picker ---------- */
function openStorage(model, colorIndex){
  picked = { model, colorIndex, storageIndex: 0 };
  const c = model.colors[colorIndex];
  $('#storageSub').textContent = model.name + ' · ' + c.name + ' · ★ ' + RATING;
  $('#storageImg').src = c.img;
  $('#storageImg').alt = model.name + ' in ' + c.name;
  $('#storages').innerHTML = model.storage.map((s, i) => `
    <button class="storage" data-i="${i}" aria-pressed="${i === 0}">${s}</button>`).join('');
  open($('#storageScrim'));
}

$('#storages').addEventListener('click', e => {
  const b = e.target.closest('.storage');
  if (!b) return;
  picked.storageIndex = +b.dataset.i;
  document.querySelectorAll('.storage').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});

$('#storageContinue').addEventListener('click', () => {
  const { model, colorIndex, storageIndex } = picked;
  cart.push({
    name: model.name,
    color: model.colors[colorIndex].name,
    img: model.colors[colorIndex].img,
    storage: model.storage[storageIndex]
  });
  close($('#storageScrim'));
  renderCart();
  openDrawer();
});

/* ---------- cart ---------- */
function renderCart(){
  $('#count').textContent = cart.length;
  $('#checkout').disabled = cart.length === 0;
  $('#items').innerHTML = cart.length
    ? cart.map((i, idx) => `
      <div class="item">
        <img src="${i.img}" alt="${i.name}">
        <div class="info">
          <strong>${i.name}</strong>
          <span>${i.color} · ${i.storage} · ★ ${RATING}</span><br>
          <button class="remove" data-idx="${idx}">Remove</button>
        </div>
      </div>`).join('')
    : '<p class="empty">Your cart is empty<br>Pick a model to get started.</p>';
}

$('#items').addEventListener('click', e => {
  const b = e.target.closest('.remove');
  if (!b) return;
  cart.splice(+b.dataset.idx, 1);
  renderCart();
});

function openDrawer(){ $('#drawer').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); }
$('#openCart').addEventListener('click', openDrawer);
$('#closeCart').addEventListener('click', closeDrawer);

/* ---------- checkout ---------- */
$('#checkout').addEventListener('click', () => {
  closeDrawer();
  $('#addressSub').textContent = cart.length + (cart.length === 1 ? ' item ready to ship' : ' items ready to ship');
  open($('#addressScrim'));
  $('#address').focus();
});

$('#addressContinue').addEventListener('click', () => {
  if (!$('#address').value.trim()){
    $('#address').focus();
    $('#address').placeholder = 'Add an address so we know where to deliver';
    return;
  }
  close($('#addressScrim'));
  $('#statusDone').hidden = true;
  $('#statusPending').hidden = false;
  restartDelivery();
  open($('#statusScrim'));
  setTimeout(() => {
    $('#statusPending').hidden = true;
    $('#statusDone').hidden = false;
    cart = [];
    renderCart();
    $('#address').value = '';
  }, 2800);
});

/* replay the van animation on every checkout */
function restartDelivery(){
  const stage = $('#deliveryStage');
  const clone = stage.cloneNode(true);
  stage.parentNode.replaceChild(clone, stage);
  clone.id = 'deliveryStage';
}

$('#doneBtn').addEventListener('click', () => close($('#statusScrim')));

/* ---------- overlay helpers ---------- */
function open(el){ el.classList.add('open'); }
function close(el){ el.classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(b => {
  b.addEventListener('click', e => {
    const scrim = e.target.closest('.scrim');
    close(scrim);
    if (scrim.id === 'addressScrim') openDrawer();
  });
});
document.querySelectorAll('.scrim').forEach(s => {
  s.addEventListener('click', e => { if (e.target === s && s.id !== 'statusScrim') close(s); });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.scrim.open').forEach(s => { if (s.id !== 'statusScrim') close(s); });
  closeDrawer();
});

renderCart();
</script>
</body>
</html>
